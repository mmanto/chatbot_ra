services:
  # PostgreSQL Database
  db:
    container_name: chatbot_ra-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_ra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    # ${DB_HOST_PORT:-5432} (host, .env) -> 5432 (contenedor postgres)
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chatbot_ra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Backend
  api:
    container_name: chatbot_ra-api
    build:
      context: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-chatbot_ra}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-480}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-operador@example.com}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-cambiar123}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3001}
    volumes:
      - ./backend:/app
    # ${API_PORT:-8001} (host, .env) -> 8000 (contenedor uvicorn)
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ./entrypoint.sh

  # Next.js Frontend (build de producción: next build + next start)
  web:
    container_name: chatbot_ra-web
    build:
      context: ./web
      args:
        # API_URL se hornea en el build (rewrites de Next): debe apuntar al
        # servicio interno `api`, NO a API_PORT del host.
        API_URL: ${API_URL:-http://api:8000}
    restart: always
    environment:
      # URL interna del servicio api (no confundir con API_PORT del host)
      API_URL: ${API_URL:-http://api:8000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar}
    # ${WEB_PORT:-3001} (host, .env) -> 3000 (contenedor next start)
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api

volumes:
  db_data:
