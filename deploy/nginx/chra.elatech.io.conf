# chatbot_ra — publicación en elatech.io
#
#  - Web (panel + chat público):  https://chra.elatech.io    → Next.js en el host (puerto ${WEB_PORT:-3001})
#  - API:                          https://apichra.elatech.io → FastAPI en el host (puerto ${API_PORT:-8001})
#
# La web sigue resolviendo /api/* por rewrite interno de Next.js (cookie same-origin,
# sin CORS); apichra.elatech.io expone la API directamente (Swagger, clientes
# programáticos y endpoints públicos del chat). Endpoints del panel (/api/auth/*,
# /api/negocios*, /api/reglas*) NO requieren CORS porque el navegador solo habla con
# chra.elatech.io. Si algún día se llama al panel cross-origin, hay que habilitar
# CORS restringido en la API.
#
# En producción la API debe ejecutarse con APP_PUBLIC_URL=https://chra.elatech.io
# para que la cookie `ra_token` se emita con Secure (ver .env / docker-compose).
#
# Instalación sugerida:
#   sudo cp deploy/nginx/chra.elatech.io.conf /etc/nginx/sites-available/chra.elatech.io.conf
#   sudo ln -s /etc/nginx/sites-available/chra.elatech.io.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d chra.elatech.io -d apichra.elatech.io
#   sudo nginx -t && sudo systemctl reload nginx
# Si los puertos del host difieren (API_PORT/WEB_PORT en .env), ajustar proxy_pass.

# ─────────────────────────── chra.elatech.io ────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name chra.elatech.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chra.elatech.io;

    ssl_certificate     /etc/letsencrypt/live/chra.elatech.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chra.elatech.io/privkey.pem;

    # Chat y edición de reglas pueden enviar textos medianos; margen holgado.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Permite HMR (websocket) si se publica el contenedor de desarrollo.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# ─────────────────────────── apichra.elatech.io ─────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name apichra.elatech.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apichra.elatech.io;

    ssl_certificate     /etc/letsencrypt/live/apichra.elatech.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apichra.elatech.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La respuesta del bot duerme 0.7 s server-side; default alcanza, margen por red.
        proxy_read_timeout 60s;
    }
}
